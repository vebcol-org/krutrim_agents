[project]
name = "krutrim-agent-agui"
version = "0.1.0"
description = "In-tree LangGraph -> AG-UI event-stream translator and its plugin surface, used by the FastAPI service."
requires-python = ">=3.11"
dependencies = [
    "ag-ui-protocol>=0.1.19",
    "langchain-core>=0.3.0",
    "loguru>=0.7.3",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
