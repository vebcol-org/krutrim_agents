[project]
name = "krutrim-agent-extensions"
version = "0.1.0"
description = "Security/governance extension points (request authentication, agent visibility, audit logging) as a middleware + registry pair. Community ships all-no-op hooks; a private deployment registers real ones via settings.extension_sources, with zero edits here."
requires-python = ">=3.11"
dependencies = [
    "starlette>=1.3.1",
    "loguru>=0.7.3",
    "krutrim-agent-management",
    "krutrim-agent-utils",
]

[tool.uv.sources]
krutrim-agent-management = { workspace = true }
krutrim-agent-utils = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
