syntax = "proto3";

package krutrim_agent.runtime.v1;

// ─────────────────────────────────────────────────────────────────────────────
// AgentRuntime — served INSIDE the sandbox container on 0.0.0.0:50051 (TCP);
// the host reaches it via a published host port or by container name on a
// shared Docker network. The host's `POST /agents/{id}` endpoint drives exactly
// one turn per RunTurn call and cancels an in-flight turn with Interrupt. The
// container has no host secrets and runs behind the host's AllowlistEgressProxy
// — anything needing egress or credentials goes back out through HostBridge
// (below), which is the single monitoring choke point.
// ─────────────────────────────────────────────────────────────────────────────
service AgentRuntime {
  rpc RunTurn(RunTurnRequest) returns (stream RunEvent);
  rpc Interrupt(InterruptRequest) returns (InterruptAck);
  rpc Health(HealthRequest) returns (HealthReply);
  rpc Shutdown(ShutdownRequest) returns (ShutdownAck);
}

message RunTurnRequest {
  string thread_id = 1;            // == session_id; the LangGraph checkpoint key
  string run_id = 2;               // AG-UI run id; server generates one if empty
  string user_message = 3;         // the last user-turn text for this run
  string frontend_tools_json = 4;  // JSON array of AG-UI tool defs; may be empty
  bool cross_agent_enabled = 5;    // grant the proxy `message_agent` tool this turn
                                   // (host decided the session has an eligible peer)
}

// Thin envelope: the container runs the existing `run_graph_as_agui` translator
// in-process and serialises each `ag_ui.core` event to JSON, so the host just
// re-encodes onto the SSE wire with no translation of its own.
message RunEvent {
  string agui_event_json = 1;
}

message InterruptRequest {
  string thread_id = 1;
}
message InterruptAck {
  bool was_running = 1;
}

message HealthRequest {}
message HealthReply {
  bool ready = 1;
  string detail = 2;
}

message ShutdownRequest {
  bool flush = 1;   // persist checkpoint / usage into the staging `out/` dir first
}
message ShutdownAck {}

// ─────────────────────────────────────────────────────────────────────────────
// HostBridge — served on the HOST for the life of one RunTurn on a TCP port
// (<bind_host>:<port>) the container dials back via <callback_host>. The
// in-sandbox agent calls back out through this for every LLM completion and
// every host-side tool (web_search / fetch_url / rag). The host performs the
// real request, LOGS it (model params, token usage, tool args/results), and
// streams the result back — so the container never holds credentials and the
// host remains the sole audit trail for LLM/tool egress.
// ─────────────────────────────────────────────────────────────────────────────
service HostBridge {
  rpc ChatComplete(ChatRequest) returns (stream ChatChunk);
  rpc InvokeHostTool(HostToolRequest) returns (HostToolReply);
}

message ChatRequest {
  string role = 1;               // profile role: main | researcher | critic | writer
  string messages_json = 2;      // LangChain messages via `messages_to_dict`
  string tools_json = 3;         // OpenAI-shaped tool schemas from bind_tools; may be empty
  string model_kwargs_json = 4;  // per-call overrides (temperature, ...); may be empty
  bool stream = 5;               // false → one terminal chunk with the full message
}

message ChatChunk {
  // One serialised AIMessageChunk (content / tool_call_chunks / usage_metadata /
  // response_metadata / id). The terminal frame sets done=true; `error` is set
  // instead of `chunk_json` on a host-side failure.
  string chunk_json = 1;
  bool done = 2;
  string error = 3;
}

message HostToolRequest {
  string tool = 1;               // web_search | fetch_url | rag
  string args_json = 2;
  string thread_id = 3;          // for host-side run logging / rag session scoping
}
message HostToolReply {
  string result_json = 1;
  string error = 2;
}
