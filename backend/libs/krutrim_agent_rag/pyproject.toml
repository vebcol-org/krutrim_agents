[project]
name = "krutrim-agent-rag"
version = "0.1.0"
description = "RAG library: session-scoped FAISS vector-store I/O, chunking, OpenRouter embeddings, retrieval, the rag_tool, and an opt-in retrieval-injection middleware. Relocated out of krutrim_agent_management so RAG concerns own their own package."
requires-python = ">=3.11"
dependencies = [
    "faisslite @ git+https://github.com/vebcol-org/faisslite.git",
    "numpy>=2.0.0",
    "langchain-core>=1.3.14",
    "langchain-openai>=1.4.1",
    "krutrim-agent-management",
    "krutrim-agent-utils",
]

[tool.uv.sources]
krutrim-agent-management = { workspace = true }
krutrim-agent-utils = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
