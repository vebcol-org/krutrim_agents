[project]
name = "krutrim-agents"
version = "0.1.0"
description = "Agent profile content (research/sales/trading/experiment) — prompts, roles, and tool wiring per agent type. Plugin content only; the lifecycle/discovery engine lives in krutrim-agents-core."
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.0",
    "krutrim-agents-core",
    "krutrim-agent-rag",
    "promptstore @ git+https://github.com/vebcol-org/promptstore.git",
]

[tool.uv.sources]
krutrim-agents-core = { workspace = true }
krutrim-agent-rag = { workspace = true }

# Forwards to krutrim_agent_rag's own gpu extra (faiss-gpu-cu12). See
# docker/backend.Dockerfile and docker/celery.Dockerfile's BUILD arg.
[project.optional-dependencies]
gpu = ["krutrim-agent-rag[gpu]"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
