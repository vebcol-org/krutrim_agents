[project]
name = "krutrim-agents-core"
version = "0.1.0"
description = "Agent lifecycle engine: profile discovery/registration, the deepagents graph builder, LLM provider abstraction, the cross-agent messaging bridge, and harness content loaders. Owns the AgentProfile contract; never imports profile content itself."
requires-python = ">=3.11"
dependencies = [
    "deepagents==0.7.8",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "langchain-ollama>=1.1.0",
    "ddgs>=9.14.4",
    "html2text>=2025.4.15",
    "httpx>=0.28.1",
    "tavily-python>=0.5.0",
    "loguru>=0.7.3",
    "langfuse>=3.15.0,<4",
    "krutrim-agent-management",
    "krutrim-agent-sandbox",
    "krutrim-agent-utils",
    "celery-types>=0.26.0",
]

[tool.uv.sources]
krutrim-agent-management = { workspace = true }
krutrim-agent-sandbox = { workspace = true }
krutrim-agent-utils = { workspace = true }

[tool.basedpyright]
reportArgumentType = "none"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
