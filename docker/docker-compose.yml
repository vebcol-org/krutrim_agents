# Full stack on your laptop's Docker engine: frontend + backend + celery
# worker + redis (+ optional ollama), one `docker compose up` instead of
# starting each piece by hand. See docker/README.md for what each file is
# and the faisslite/SSH-forwarding setup this build needs.
#
# `backend` and `celery-worker` get /var/run/docker.sock bind-mounted, so
# when their code asks the Docker SDK to create a krutrim-agent-sandbox-* container
# it's asking THIS SAME laptop engine to start a sibling container — not
# nested Docker-in-Docker. `docker ps` on the host shows those sandbox
# containers right alongside backend/celery-worker/frontend/redis.
#
#
# This is the PRODUCTION stack: images built from each Dockerfile's `prod`
# target (minimal, non-root, no build tools), immutable — no source is
# mounted in, a code change means a rebuild. For a hot-reload local loop use
# docker/docker-compose.dev.yml instead (see docker/README.md).
#
# Two kinds of variable feed this file:
#   * ${VAR} interpolations (REDIS_PASSWORD, VITE_BACKEND_URL, TORCH_BACKEND, …)
#     come from the repo-root .env, which `docker compose` auto-loads.
#   * backend/celery-worker also get every key of ../.env.prod injected via
#     `env_file` (git-ignored; `cp .env.example .env.prod`). Marked
#     required:false so the stack still starts without it.
# See ../.env.example for every key and the KRUTRIM_AGENT_ prefix rule.
#
# Run from the repo root:
#   cp .env.example .env.prod    # then fill it in (also `cp .env.example .env`
#                                # for the ${VAR} interpolations above)
#   docker compose -f docker/docker-compose.yml build
#   docker compose -f docker/docker-compose.yml up -d

# COMPOSE_PROJECT_NAME (repo-root .env or the shell) overrides this — run a
# second isolated copy of the stack with `COMPOSE_PROJECT_NAME=krutrim-staging
# docker compose -f docker/docker-compose.yml up`.
name: ${COMPOSE_PROJECT_NAME:-krutrim-agent}

services:

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    # Array form matters here: a plain string command gets whitespace-split,
    # which silently DROPS a blank ${REDIS_PASSWORD} instead of passing it
    # through as an empty argument — redis-server would then either error
    # on a missing --requirepass value or misparse the next token as the
    # password. The array form preserves "" exactly, which is how Redis
    # itself represents "no password" (auth off, today's default).
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - krutrim-redis-data:/data
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: krutrim_qdrant
    profiles: ["qdrant"]
    volumes:
      - krutrim-qdrant-data:/qdrant/storage
    ports:
      - "${QDRANT_HTTP_PORT:-6343}:6333"
      - "${QDRANT_GRPC_PORT:-6344}:6334"
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  backend:
    image: krutrim_agent-backend:latest
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
      target: prod
      args:
        # cpu (default) | gpu — see docker/backend.Dockerfile's TORCH_BACKEND
        # header. gpu also needs the `deploy:` device reservation below.
        TORCH_BACKEND: ${TORCH_BACKEND:-cpu}
    env_file:
      - path: ../.env.prod
        required: false
    environment:
      KRUTRIM_AGENT_REDIS_URL: redis://${REDIS_PASSWORD:+$REDIS_USER:$REDIS_PASSWORD@}redis:6379/0
      KRUTRIM_AGENT_STORAGE_ROOT: /data
      # Vector store: faisslite (default) or qdrant — a pure RUNTIME switch (no
      # rebuild; both clients ship in the image). In .env.prod set
      # KRUTRIM_AGENT_VECTOR_STORE_BACKEND=qdrant + COMPOSE_PROFILES=qdrant +
      # KRUTRIM_AGENT_QDRANT_URL=http://qdrant:6333; they reach the container
      # via env_file above. See .env.example.
      OPENROUTER_API_KEY: ${LITELLM_MASTER_KEY:-${OPENROUTER_API_KEY:-NO_API_KEY}}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:+http://host.docker.internal:4000/}
      TAVILY_SEARCH_API_BASE: ${TAVILY_SEARCH_API_BASE:+http://host.docker.internal:4100/}
      LANGFUSE_BASE_URL: ${LANGFUSE_DOCKER_BASE_URL:-${LANGFUSE_BASE_URL:+http://host.docker.internal:3000}}
    ports:
      - '8000:8000'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Sessions/projects/sandbox-container registry (see
      # krutrim_agent_management/local.py's STORAGE_ROOT layout) — bind-mounted to
      # your real home dir so it survives `docker compose down`/rebuilds,
      # not just container restarts.
      - ${HOME}/.krutrim_agent:/data
      # Provider settings + per-agent run transcripts (gitignored, written
      # at runtime) — same reasoning.
      - ../backend/harness/memory:/app/harness/memory
    depends_on:
      redis:
        condition: service_started
      # qdrant only exists when the "qdrant" profile is active — required:
      # false keeps `docker compose up` working when it's not (e.g. the
      # default faisslite backend), instead of erroring on an inactive
      # service.
      qdrant:
        condition: service_started
        required: false
    # The prod image defaults to a non-root user, but this service drives the
    # host Docker daemon through the socket mounted just above — which is
    # root-owned — so it needs root. Kept here, next to that mount, rather
    # than in the image. no-new-privileges still blocks setuid escalation.
    user: "0:0"
    init: true
    security_opt:
      - no-new-privileges:true
    # GPU (TORCH_BACKEND=gpu): uncomment to hand the container the host's
    # NVIDIA GPUs (needs nvidia-container-toolkit on a CUDA linux/amd64 host).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped

  celery-worker:
    image: krutrim_agent-celery:latest
    build:
      context: ../backend
      dockerfile: ../docker/celery.Dockerfile
      target: prod
      args:
        # cpu (default) | gpu — see docker/celery.Dockerfile's TORCH_BACKEND
        # header (cpu skips ~5GB of nvidia-* CUDA libs). gpu also needs the
        # `deploy:` device reservation below.
        TORCH_BACKEND: ${TORCH_BACKEND:-cpu}
    env_file:
      - path: ../.env.prod
        required: false
    environment:
      KRUTRIM_AGENT_REDIS_URL: redis://${REDIS_PASSWORD:+$REDIS_USER:$REDIS_PASSWORD@}redis:6379/0
      KRUTRIM_AGENT_STORAGE_ROOT: /data
      LANGFUSE_BASE_URL: ${LANGFUSE_DOCKER_BASE_URL:-${LANGFUSE_BASE_URL:+http://host.docker.internal:3000}}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:+http://host.docker.internal:4000/}
      OPENROUTER_API_KEY: ${LITELLM_MASTER_KEY:-${OPENROUTER_API_KEY:-NO_API_KEY}}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same STORAGE_ROOT as `backend` — the reaper scans/updates
      # containers.db, so both processes must point at the same data.
      - ${HOME}/.krutrim_agent:/data
      - ../backend/harness/memory:/app/harness/memory
    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_started
        required: false
    # Same reason as `backend` — the mounted docker.sock is root-owned.
    user: "0:0"
    init: true
    security_opt:
      - no-new-privileges:true
    # GPU (TORCH_BACKEND=gpu) — the worker is the heavier CUDA user (docling).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped

  frontend:
    image: krutrim_agent-frontend:latest
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      target: prod
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8000}
    # Host 4200 -> 8080 in the container: the nginx-unprivileged base serves
    # on 8080 as a non-root user (see frontend.Dockerfile / nginx.conf).
    ports:
      - '4200:8080'
    depends_on:
      - backend
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  krutrim-redis-data:
  krutrim-qdrant-data:

