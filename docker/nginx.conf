server {
    # 8080, not 80: the nginx-unprivileged base runs as a non-root user and
    # can't bind a privileged port. Compose publishes the host port
    # (docker-compose.yml maps 4200 -> 8080).
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router (apps/web/src) does client-side routing — any path not
    # matching a real static file falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
